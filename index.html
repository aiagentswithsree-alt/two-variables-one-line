<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Two Variables, One Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* THEME:START */
:root{
  --bg:#f5eee2;--paper:#fbf7ef;--ink:#2a2620;--muted:#6f675b;--line:#2a2620;--soft:#e7dccb;
  --req:#e8833a;--res:#5e9e5a;--hs:#3c7fb8;--warn:#d64545;--accent:#cfe8b4;--accent-ink:#2f5b1f;
  --chip1:#f6dfa3;--chip2:#d6ecc4;--chip3:#e2d7f5;--node:#f3c969;--node2:#8fb3e0;--node3:#b9a6e6;--node4:#9ccf8f;
  --shadow:3px 3px 0 var(--line);--r:14px;
  --mono:'JetBrains Mono',ui-monospace,monospace;--sans:Inter,system-ui,sans-serif;
}
[data-theme=dark]{
  --bg:#1c1a17;--paper:#25221e;--ink:#efe7da;--muted:#a59c8e;--line:#efe7da;--soft:#3a352e;
  --accent:#3d5a2c;--accent-ink:#d6f0c0;--chip1:#5a4a20;--chip2:#2f4a26;--chip3:#3d3358;
}
/* THEME:END */
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
body{background-image:radial-gradient(var(--soft) 1px,transparent 1px);background-size:18px 18px}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:var(--mono)}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--bg);border-bottom:2px solid var(--line)}
.iconbtn{width:38px;height:38px;border:2px solid var(--line);border-radius:10px;background:var(--paper);display:grid;place-items:center;box-shadow:2px 2px 0 var(--line)}
.iconbtn:active{transform:translate(2px,2px);box-shadow:none}
.brand{font-family:var(--mono);font-weight:800;font-size:18px;flex:1}
.brand mark{background:var(--accent);color:inherit;padding:0 4px}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 110px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.wrap>*{min-width:0}
.card{background:var(--paper);border:2px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.crumb{font-family:var(--mono);font-size:13px;color:var(--muted)}
h1{font-family:var(--mono);font-weight:800;font-size:clamp(26px,4vw,40px);margin:6px 0 10px;letter-spacing:-.5px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:12px;padding:4px 10px;border:2px solid var(--line);border-radius:999px;background:var(--chip1)}
.chip:nth-child(2){background:var(--chip2)}.chip:nth-child(3){background:var(--chip3)}
.tagline{color:var(--muted);margin:10px 0 14px}
.stage{padding:12px;position:relative}
.metrics{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.metric{flex:1 0 110px;border:2px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--bg)}
.metric small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.6px;color:var(--muted);text-transform:uppercase}
.metric b{font-family:var(--mono);font-size:18px;white-space:nowrap}
.metric.total{background:var(--accent)}
.metric.flash b{color:var(--warn)}
svg.scene{width:100%;height:auto;display:block;margin-top:8px}
.legend{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.controls{margin-left:auto;display:flex;gap:6px}
.stage:fullscreen{background:var(--paper);overflow:auto}
.side{display:flex;flex-direction:column;gap:14px}
.steps{padding:12px 14px}
.steps .hdr{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.stepnav{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.stepnav button{min-width:30px;height:30px;border:2px solid var(--line);border-radius:8px;background:var(--bg);font-family:var(--mono);font-size:12px;padding:0 8px}
.stepnav button.done{background:var(--chip2)}
.stepnav button.on{background:var(--ink);color:var(--paper)}
.panel{padding:16px 18px}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.8px;color:var(--muted)}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;border:2px solid var(--line);margin:6px 0}
.tag.CONCEPT{background:var(--chip2)}.tag.PROBLEM{background:#f4c3c3;color:#2a2620}.tag.RECAP{background:var(--chip3)}.tag.TRY{background:var(--chip1)}
.panel h2{font-family:var(--mono);font-size:21px;margin:6px 0 10px}
.panel p{line-height:1.6;margin:0 0 10px}
.box{border:2px dashed var(--line);border-radius:10px;padding:10px 12px;margin:12px 0;background:var(--bg)}
.box .kicker{display:block;margin-bottom:4px}
.changes div{display:flex;gap:8px;font-size:14px;margin:4px 0}
.changes i{font-style:normal;font-family:var(--mono);font-weight:800;width:14px}
.points{padding-left:18px;line-height:1.6}
table.tbl{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:13px}
table.tbl td{padding:4px 0;border-bottom:1px dashed var(--soft)}table.tbl td:last-child{text-align:right}
table.tbl tr.sum td{font-weight:800;border-bottom:none;border-top:2px solid var(--line)}
.quiz button{display:block;width:100%;text-align:left;margin:6px 0;padding:8px 10px;border:2px solid var(--line);border-radius:8px;background:var(--paper)}
.quiz button.ok{background:var(--chip2)}.quiz button.bad{background:#f4c3c3;color:#2a2620}
.fb{font-size:14px;margin-top:6px}
.learn ul{padding-left:18px;line-height:1.7;margin:6px 0 0}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;gap:10px;padding:12px 16px;background:var(--bg);border-top:2px solid var(--line)}
.bottombar button{border:2px solid var(--line);border-radius:12px;padding:12px 16px;background:var(--paper);box-shadow:2px 2px 0 var(--line);font-weight:600}
.bottombar .next{flex:1;background:var(--accent);color:var(--accent-ink);text-align:left;display:flex;justify-content:space-between;font-family:var(--mono)}
.bottombar button:disabled{opacity:.4;cursor:default}
.drawer{position:fixed;inset:0 auto 0 0;width:min(360px,90vw);z-index:40;background:var(--paper);border-right:2px solid var(--line);transform:translateX(-102%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.open{transform:none}
.scrim{position:fixed;inset:0;background:#0006;z-index:30;display:none}.scrim.open{display:block}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:14px;border-bottom:2px solid var(--line);font-family:var(--mono);font-weight:800}
.drawer .list{overflow:auto;flex:1;padding:8px 10px}
.mod{margin:4px 0}.mod>button{width:100%;display:flex;gap:8px;align-items:center;border:0;background:none;padding:8px 4px;font-family:var(--mono);font-weight:600;text-align:left}
.mod .sw{width:14px;height:12px;border-radius:3px;border:1.5px solid var(--line)}
.mod .cnt{margin-left:auto;font-size:11px;color:var(--muted)}
.mod ul{list-style:none;margin:0 0 6px 22px;padding:0;border-left:2px dashed var(--soft)}
.mod li a{display:block;padding:6px 10px;color:var(--ink);text-decoration:none;font-size:14px;border-radius:8px;margin-left:6px}
.mod li a.cur{background:var(--accent);border:2px solid var(--line)}
.mod li a.done::after{content:" ✓";color:var(--res);font-weight:800}
.drawer .prog{padding:12px 14px;border-top:2px solid var(--line);font-family:var(--mono);font-size:13px;display:flex;justify-content:space-between}

.board{margin:8px 0 10px;display:flex;flex-direction:column;gap:10px}
.board .kicker{display:block;margin-bottom:4px}
.qbox{border:2px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--chip1);font-size:16px;line-height:1.55}
[data-theme=dark] .qbox{color:var(--ink)}
.simple{border-left:4px solid var(--res);padding:6px 12px;background:var(--bg);border-radius:0 8px 8px 0;line-height:1.5}
.gf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gf>div{border:2px dashed var(--line);border-radius:10px;padding:8px 12px;background:var(--bg);line-height:1.5}
.gf ul{margin:0;padding-left:18px}
@media(max-width:560px){.gf{grid-template-columns:1fr}}
.sol{margin-top:4px}
ol.lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ol.lines li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--paper);scroll-margin-bottom:110px;scroll-margin-top:80px}
ol.lines li.new{background:var(--accent);animation:pop .35s ease}
ol.lines .n{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:800;background:var(--bg)}
ol.lines .w{font-family:var(--mono);font-size:17px;font-weight:600;overflow-wrap:anywhere;white-space:pre-wrap}
ol.lines .why{font-size:14px;color:var(--muted);margin-top:3px}
ol.lines li.new .why{color:var(--accent-ink)}
.more{font-size:14px;color:var(--muted);border:2px dashed var(--soft);border-radius:10px;padding:10px 12px;text-align:center}
.check{border:2px dashed var(--res);border-radius:10px;padding:10px 12px;background:var(--bg);line-height:1.5}
.ans{border:2px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--chip2);font-size:16px;line-height:1.55;box-shadow:2px 2px 0 var(--line)}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.82em;line-height:1.15;margin:0 2px}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 2px}
.solvebtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.solvebtns button{border:2px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--paper);font-size:13px;font-family:var(--mono);box-shadow:2px 2px 0 var(--line)}
.tag.SOLVE{background:var(--chip1)}
.points.big{font-size:16px;line-height:1.7}
@keyframes pop{from{transform:translateY(6px);opacity:.2}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <button class="iconbtn" id="menuBtn" aria-label="Open course menu">☰</button>
  <div class="brand" id="brand"></div>
  <button class="iconbtn" id="themeBtn" aria-label="Toggle dark mode">◐</button>
</header>
<div class="scrim" id="scrim"></div>
<nav class="drawer" id="drawer" aria-label="Course">
  <div class="dh"><span style="flex:1">Course</span><span class="mono" id="lessonCount" style="font-size:11px;font-weight:400"></span><button class="iconbtn" id="closeDrawer" aria-label="Close menu">✕</button></div>
  <div class="list" id="courseList"></div>
  <div class="prog"><span>PROGRESS</span><span id="progTxt"></span></div>
</nav>

<main class="wrap">
  <section>
    <div class="crumb" id="crumb"></div>
    <h1 id="title"></h1>
    <div class="chips" id="chips"></div>
    <p class="tagline" id="tagline"></p>
    <div class="card stage" id="stage">
      <div class="metrics" id="metrics"></div>
      <svg class="scene" id="scene" viewBox="0 0 720 400" role="img" aria-label="Animated diagram"></svg>
      <div class="board" id="board" aria-live="polite"></div>
      <div class="legend" id="legend">
        <span><i class="dot" style="background:var(--req)"></i>request</span>
        <span><i class="dot" style="background:var(--res)"></i>response</span>
        <span><i class="dot" style="border:2px solid var(--hs)"></i>handshake</span>
        <div class="controls">
          <button class="iconbtn" id="restartBtn" aria-label="Restart lesson">↺</button>
          <button class="iconbtn" id="pauseBtn" aria-label="Pause animation">❚❚</button>
          <button class="iconbtn" id="fsBtn" aria-label="Full screen">⤢</button>
        </div>
      </div>
    </div>
  </section>
  <aside class="side">
    <div class="card steps">
      <div class="hdr"><span>In this lesson</span><span id="stepCount"></span></div>
      <div class="stepnav" id="stepNav"></div>
    </div>
    <article class="card panel" id="panel" aria-live="polite"></article>
    <div class="card panel learn" id="learn"></div>
  </aside>
</main>

<div class="bottombar">
  <button id="backBtn">← Back</button>
  <button class="next" id="nextBtn"><span id="nextTxt"></span><span>→</span></button>
</div>

<script>
/* COURSE-DATA:START — the only part you rewrite for a new lesson/course */
const RL = {m:-6/5, d:28/5, label:'60x + 50y = 280', at:1.6, color:'var(--hs)'};       // Radha's bill line
const WL = {m:-1,   d:5,    label:'x + y = 5',        at:4.2, color:'var(--req)'};      // the 5 kg clue
const PLOT_LEGEND = [['var(--hs)','line'],['var(--res)','solution ✓'],['var(--warn)','not a solution'],['var(--req)','moving point']];
const AX = {xl:'x · kg of mangoes', yl:'y · kg of bananas'};

const COURSE = {
  brand: 'Two Variables, <mark>One Line</mark>',
  storageKey: 'gm9-ch13-two-variables',
  modules: [
    { name: 'One Equation', color: '#e2b44a', lessons: [
      {
        slug: 'one-bill-many-answers',
        title: 'One Bill, Many Answers',
        minutes: 10, level: 'Grade 9',
        tagline: 'Radha paid ₹280 for mangoes and bananas. Follow that one bill until it turns into a straight line.',
        learn: ['Turn a shopping situation into a linear equation in two variables','Write any such equation in standard form ax + by + c = 0','Check whether an ordered pair is a solution','Why one equation has infinitely many solutions','Why every solution sits on one straight line'],
        nextTeaser: 'How Steep Is a Line? — measuring the tilt of Radha’s line with rise and run.',
        unitPrefix: '₹', unit: '',
        legend: PLOT_LEGEND,
        metrics: [ {id:'mango',label:'Mangoes 60x'},{id:'banana',label:'Bananas 50y'} ],
        totalLabel: 'Bill (target ₹280)',
        nodes: [], edges: [],
        steps: [
          { nav:'The bill', tag:'CONCEPT', title:'Radha pays ₹280',
            body:['At a fruit cart, mangoes cost <b>₹60 a kg</b> and bananas <b>₹50 a kg</b>. Radha buys some of each and pays <b>₹280</b>.','She has forgotten how many kilograms of each she bought. Can we work it out?'],
            key:'Two unknown amounts, one known fact. The whole chapter grows from this setting.',
            plot:{xr:[-1,7],yr:[-2.5,7],...AX}, metrics:{} },
          { nav:'Write it', tag:'CONCEPT', title:'Name the unknowns, write the equation',
            body:['Let <b>x</b> = kg of mangoes and <b>y</b> = kg of bananas. Mangoes cost 60x rupees and bananas cost 50y rupees.','Both sides below measure the same money, so <b>60x + 50y = 280</b>.'],
            changes:[['+','x = kilograms of mangoes'],['+','y = kilograms of bananas'],['+','equation 60x + 50y = 280']],
            key:'An equation with two variables, each raised only to the power 1, is a <b>linear equation in two variables</b>.',
            plot:{xr:[-1,7],yr:[-2.5,7],...AX}, metrics:{} },
          { nav:'Standard form', tag:'CONCEPT', title:'Put it in standard form',
            body:['Any such equation can be written as <b>ax + by + c = 0</b>, where a and b are not both zero.','Move 280 across: <b>60x + 50y − 280 = 0</b>. Dividing every term by 10 gives the same equation with smaller numbers: 6x + 5y − 28 = 0.'],
            table:{title:'Reading off a, b, c',rows:[['a (coefficient of x)','60'],['b (coefficient of y)','50'],['c (constant)','−280']],foot:'Fractions or decimals are allowed too; we usually clear them by multiplying.'},
            quiz:{q:'Which is 2y = 7 written in standard form?',options:['0·x + 2y − 7 = 0','2x + y − 7 = 0','It is not a linear equation in two variables'],answer:0,why:'The coefficient of x is simply 0. Equations like this still count as linear equations in two variables.'},
            plot:{xr:[-1,7],yr:[-2.5,7],...AX}, metrics:{} },
          { nav:'First guess', tag:'CONCEPT', title:'Try x = 3, y = 2',
            body:['Substitute: 60 × 3 + 50 × 2 = 180 + 100 = 280. The bill matches.','So x = 3, y = 2 is a <b>solution</b>. We write it as the ordered pair <b>(3, 2)</b>: x first, then y.'],
            key:'A solution is a pair of values that makes the left side equal the right side.',
            plot:{xr:[-1,7],yr:[-2.5,7],...AX, points:[{x:3,y:2,label:'(3, 2) ✓',ok:true}], movers:[{from:[0,0],to:[3,2]}]},
            metrics:{mango:180,banana:100} },
          { nav:'Swap order', tag:'PROBLEM', title:'Case: the pair written backwards',
            body:['What about (2, 3)? That means 2 kg mangoes and 3 kg bananas: 120 + 150 = 270. The bill is ₹10 short.','Same two numbers, different order, different answer.'],
            changes:[['~','x: 3 → 2 kg'],['~','y: 2 → 3 kg'],['~','bill: ₹280 → ₹270 ✗']],
            key:'Order matters. In (a, b) the first number is always x and the second is always y.',
            plot:{xr:[-1,7],yr:[-2.5,7],...AX, points:[{x:3,y:2,label:'(3, 2) ✓',ok:true,dx:34,dy:14},{x:2,y:3,label:'(2, 3) ✗',bad:true}], movers:[{from:[0,0],to:[2,3]}]},
            metrics:{mango:120,banana:150}, flash:['_total'] },
          { nav:'More answers', tag:'CONCEPT', title:'Pick any x, and y follows',
            body:['Choose a value for x, put it in, and solve the one-variable equation that is left for y.','x = 0.5 gives 30 + 50y = 280, so y = 5. Since x can be any number, the solutions never run out.'],
            table:{title:'Solutions found so far',rows:[['x = 0','y = 5.6'],['x = 0.5','y = 5'],['x = 1','y = 4.4'],['x = 3','y = 2']],foot:'Each row puts the bill at exactly ₹280.'},
            plot:{xr:[-1,7],yr:[-2.5,7],...AX, points:[{x:0,y:5.6,label:'(0, 5.6)',ok:true,dx:44,dy:4},{x:0.5,y:5,label:'(0.5, 5)',ok:true,dx:50,dy:6},{x:1,y:4.4,label:'(1, 4.4)',ok:true,dx:50,dy:6},{x:3,y:2,label:'(3, 2)',ok:true,dx:40,dy:6}], movers:[{from:[0.5,0],to:[0.5,5]}]},
            metrics:{mango:30,banana:250} },
          { nav:'The line', tag:'CONCEPT', title:'All the solutions form a line',
            body:['Rearranged, the equation reads <b>y = −(6/5)x + 28/5</b>. Plotting every solution gives one straight line.','Each point on the line is a solution, and each solution is a point on the line.'],
            key:'The graph of a linear equation in two variables is always a straight line.',
            quiz:{q:'Is (4, 0.8) on Radha’s line?',options:['Yes: 240 + 40 = 280','No: x must be a whole number','No: the point is too close to the x-axis'],answer:0,why:'60 × 4 + 50 × 0.8 = 240 + 40 = 280, so the pair satisfies the equation and lies on the line.'},
            plot:{xr:[-1,7],yr:[-2.5,7],...AX, lines:[RL], points:[{x:0,y:5.6,ok:true},{x:0.5,y:5,ok:true},{x:1,y:4.4,ok:true},{x:3,y:2,label:'(3, 2)',ok:true,dx:40,dy:6}], movers:[{from:[0,5.6],to:[14/3,0]}]},
            metrics:{mango:180,banana:100} },
          { nav:'Real limits', tag:'PROBLEM', title:'Case: a solution no shop can sell',
            body:['Follow the line further. At x = 6, y = −1.6: 360 − 80 = 280. The equation is satisfied.','But nobody can buy −1.6 kg of bananas. Only the part of the line where x ≥ 0 and y ≥ 0 makes sense for Radha.'],
            changes:[['+','point (6, −1.6) satisfies the equation'],['-','negative kilograms are impossible in real life']],
            key:'Algebra gives every solution. The situation decides which ones are sensible.',
            plot:{xr:[-1,7],yr:[-2.5,7],...AX, lines:[RL], points:[{x:3,y:2,label:'(3, 2)',ok:true,dx:40,dy:6},{x:6,y:-1.6,label:'(6, −1.6) ?',bad:true,dx:-50,dy:4}], movers:[{from:[3,2],to:[6,-1.6]}]},
            metrics:{mango:360,banana:-80}, flash:['banana'] },
          { nav:'Recap', tag:'RECAP', title:'One bill, a whole line of answers',
            body:['One equation narrowed Radha’s purchase down to a line, not to one answer. To pin it down we need a second fact.'],
            points:['Linear equation in two variables: ax + by + c = 0, with a and b not both zero.','A solution is an ordered pair; the order is (x, y).','There are infinitely many solutions, and together they make a straight line.','The real situation can rule out some solutions, such as negative amounts.'],
            table:{title:'The (3, 2) bill',rows:[['3 kg mangoes × ₹60','₹180'],['2 kg bananas × ₹50','₹100']],sum:['total','₹280'],foot:'Correct, but (0.5, 5) and (1, 4.4) also give ₹280.'},
            plot:{xr:[-1,7],yr:[-2.5,7],...AX, lines:[RL], points:[{x:3,y:2,label:'(3, 2)',ok:true,dx:40,dy:6}]},
            metrics:{mango:180,banana:100} }
        ]
      },
      {
        slug: 'how-steep-is-a-line',
        title: 'How Steep Is a Line?',
        minutes: 12, level: 'Grade 9',
        tagline: 'Ride a cyclist up and down straight-line roads and measure steepness with one number.',
        learn: ['What rise, run and slope mean','Why the slope is the same between any two points on a line','Positive, negative, zero and undefined slopes','Reading the slope m and intercept d from y = mx + d','Getting the slope from standard form: m = −a/b'],
        nextTeaser: 'Where Two Lines Meet — add a second clue to Radha’s bill and find the single answer.',
        unit: '', total: false,
        legend: [['var(--req)','run (across)'],['var(--res)','rise (up/down)'],['var(--hs)','line']],
        metrics: [ {id:'rise',label:'Rise'},{id:'run',label:'Run'},{id:'slope',label:'Slope = rise ÷ run'} ],
        nodes: [], edges: [],
        steps: [

 {nav:'Q6',tag:'SOLVE',title:'Q6 · True or False',body:[TRY],
  key:'For “False”, one counter-example is enough. For “True”, give the reason.',
  solve:{q:'True or False? Justify. (i) A linear equation in two variables has only one solution. (ii) Its graph always passes through the origin. (iii) It can never have rational solutions. (iv) x = 3 is a valid linear equation in two variables. (v) 2x + 3y = 7 has infinitely many solutions. (vi) (1, 2) is a solution of 2x + 3y = 7.',
   simple:'Decide each one, then give a reason or an example.',
   given:['six statements'], find:'True / False with a reason',
   lines:[
    ['(i) FALSE','x + y = 2 has (0, 2), (1, 1), (2, 0) and many more. It has infinitely many solutions.'],
    ['(ii) FALSE','x + y = 2: put (0, 0) → 0 ≠ 2. It passes through the origin only when c = 0.'],
    ['(iii) FALSE','(1, 1) is a solution of x + y = 2, and 1 is a rational number.'],
    ['(iv) TRUE','x = 3 can be written as 1·x + 0·y − 3 = 0, with a = 1, b = 0.'],
    ['(v) TRUE','For every value of x we can find a y, so there is no end to the solutions.'],
    ['(vi) FALSE','2(1) + 3(2) = 2 + 6 = 8 ≠ 7.']],
   check:'Every “False” has an example that breaks it; every “True” has a reason.',
   answer:'(i) False (ii) False (iii) False (iv) True (v) True (vi) False'}},
 {nav:'Q7 (i)',tag:'SOLVE',title:'Q7 (i) · Same solutions',body:[TRY],
  key:'Multiplying or dividing an equation by the same non-zero number does not change its solutions.',
  solve:{q:'Compare the solutions of 3x + 4y = 7 and 6x + 8y = 14. Argue that every solution of one is also a solution of the other.',

    ['(2) = 2 × (1):  2(3x + 4y) = 2(7)','Multiply both sides of (1) by 2.'],

    ['Then 6p + 8q = 2(3p + 4q) = 2 × 7 = 14','So (p, q) also satisfies (2).'],
    ['Suppose (p, q) satisfies (2): 6p + 8q = 14','Take any solution of (2).'],
    ['Then 3p + 4q = (6p + 8q) ÷ 2 = 14 ÷ 2 = 7','So (p, q) also satisfies (1).']],

 {nav:'Q7 (ii)',tag:'SOLVE',title:'Q7 (ii) · The general case',body:[TRY],

 {nav:'Q1 (ii)',tag:'SOLVE',title:'Q1 (ii) · Three times the other',body:[TRY],

 {nav:'Q1 (iv)',tag:'SOLVE',title:'Q1 (iv) · Taxi charges',body:[TRY],

 {nav:'Q1 (v)',tag:'SOLVE',title:'Q1 (v) · Find the fraction',body:[TRY],
  key:'For fractions: let the fraction be x/y, then cross-multiply to remove the fractions.',
  solve:{q:'A fraction becomes 9/11 if 2 is added to both numerator and denominator. If 3 is added to both, it becomes 5/6. Find the fraction.',
   simple:'Fraction = x/y. Add 2 to top and bottom → 9/11. Add 3 → 5/6.',
   given:[`${fr('x + 2','y + 2')} = ${fr(9,11)}`,`${fr('x + 3','y + 3')} = ${fr(5,6)}`], find:'x/y',
   lines:[
    ['11(x + 2) = 9(y + 2)  →  11x + 22 = 9y + 18','Cross-multiply the first.'],
    ['11x − 9y = −4  …(1)','Move terms: 18 − 22 = −4.'],
    ['6(x + 3) = 5(y + 3)  →  6x + 18 = 5y + 15','Cross-multiply the second.'],
    ['6x − 5y = −3  …(2)','15 − 18 = −3.'],
    ['(1) × 5: 55x − 45y = −20;   (2) × 9: 54x − 45y = −27','Make the y-terms equal.'],

    ['In (1):  77 − 9y = −4  →  9y = 81  →  y = 9','Substitute x = 7.']],

   answer:'The fraction is <b>7/9</b>.'}},
 {nav:'Q1 (vi)',tag:'SOLVE',title:'Q1 (vi) · Another fraction',body:[TRY],

    ['(2) − (1):  x = 1 − (−2) = 3','y cancels.'],
    ['In (1):  3 − y = −2  →  y = 5','']],
   check:'(3+1)/(5−1) = 4/4 = 1 ✓   3/(5+1) = 3/6 = 1/2 ✓',
   answer:'The fraction is <b>3/5</b>.'}},

function renderPanel(step){
  let h=`<span class="kicker">STEP ${S+1} / ${L.steps.length}</span><br><span class="tag ${step.tag||'CONCEPT'}">${step.tag||'CONCEPT'}</span><h2>${step.title}</h2>`;
  (step.body||[]).forEach(p=>h+=`<p>${p}</p>`);
  if(step.points)h+=`<ul class="points">${step.points.map(p=>`<li>${p}</li>`).join('')}</ul>`;
  if(step.key)h+=`<div class="box"><span class="kicker">KEY IDEA</span>${step.key}</div>`;
  if(step.changes)h+=`<div class="box changes"><span class="kicker">WHAT CHANGED</span>${step.changes.map(([o,t])=>`<div><i>${o}</i><span>${t}</span></div>`).join('')}</div>`;
  if(step.table){const T=step.table;h+=`<div class="box"><span class="kicker">${T.title.toUpperCase()}</span><table class="tbl">${T.rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}${T.sum?`<tr class="sum"><td>${T.sum[0]}</td><td>${T.sum[1]}</td></tr>`:''}</table>${T.foot?`<div class="fb">${T.foot}</div>`:''}</div>`;}
  if(step.quiz){const Q=step.quiz;h+=`<div class="box quiz"><span class="kicker">QUICK CHECK</span><div>${Q.q}</div>${Q.options.map((o,i)=>`<button data-i="${i}">${o}</button>`).join('')}<div class="fb" id="qfb"></div></div>`;}
  if(step.solve)h+=`<div class="box"><span class="kicker">YOUR CONTROLS</span><span id="revTxt" class="mono">${R} / ${step.solve.lines.length} lines</span><div class="solvebtns"><button id="revNext">Next line</button><button id="revAll">Show full solution</button><button id="revHide">Hide working</button></div></div>`;
  if(S===L.steps.length-1&&L.nextTeaser)h+=`<div class="box"><span class="kicker">COMING UP</span>Next up: ${L.nextTeaser}</div>`;
  $('#panel').innerHTML=h;
  if(step.solve){$('#revNext').onclick=()=>reveal(R+1);$('#revAll').onclick=()=>reveal(step.solve.lines.length);$('#revHide').onclick=()=>reveal(0);}
  if(step.quiz)$('#panel').querySelectorAll('.quiz button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,Q=step.quiz;
    b.classList.add(i===Q.answer?'ok':'bad');$('#qfb').innerHTML=(i===Q.answer?'✓ Right. ':'✗ Not quite. ')+Q.why;});
}
function renderNav(){
  const done=store.get(doneKey,{});const seen=done[L.slug+':steps']||0;
  $('#stepNav').innerHTML=L.steps.map((s,i)=>`<button class="${i===S?'on':''} ${i<seen?'done':''}" data-i="${i}" title="${s.nav}">${i===S?`${i+1} ${s.nav}`:i+1}</button>`).join('');
  $('#stepNav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i));
}
function renderHead(){
  const m=L.module;$('#brand').innerHTML=COURSE.brand;document.title=`${L.title} · ${COURSE.brand.replace(/<[^>]+>/g,'')}`;
  $('#crumb').textContent=`${String(L.mi+1).padStart(2,'0')}. ${m.name} / Lesson ${L.li+1} of ${m.lessons.length}`;
  $('#title').textContent=L.title;$('#tagline').textContent=L.tagline;
  $('#chips').innerHTML=`<span class="chip">⏱ ${L.minutes} min</span><span class="chip">▮ ${L.level}</span><span class="chip">☰ ${L.steps.length} steps</span>`;
  if(L.legend){const lg=$('#legend');lg.querySelectorAll(':scope>span').forEach(s=>s.remove());lg.insertAdjacentHTML('afterbegin',L.legend.map(([c,t])=>`<span><i class="dot" style="background:${c}"></i>${t}</span>`).join(''));}
  $('#learn').innerHTML=`<span class="kicker">YOU’LL LEARN</span><ul>${L.learn.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  renderDrawer();
}
function renderDrawer(){
  const done=store.get(doneKey,{});const total=ALL.length;const n=ALL.filter(l=>done[l.slug]).length;
  $('#lessonCount').textContent=`${total} lessons`;$('#progTxt').textContent=`${n} / ${total}`;
  $('#courseList').innerHTML=COURSE.modules.map((m,mi)=>`<div class="mod"><button aria-expanded="true"><span class="sw" style="background:${m.color}"></span>${String(mi+1).padStart(2,'0')}. ${m.name}<span class="cnt">${m.lessons.filter(l=>done[l.slug]).length}/${m.lessons.length}</span></button><ul>${m.lessons.map(l=>`<li><a href="#${l.slug}-1" class="${l.slug===L.slug?'cur':''} ${done[l.slug]?'done':''}">${l.title}</a></li>`).join('')}</ul></div>`).join('');
  $('#courseList').querySelectorAll('.mod>button').forEach(b=>b.onclick=()=>{const ul=b.nextElementSibling;const o=ul.style.display!=='none';ul.style.display=o?'none':'';b.setAttribute('aria-expanded',!o)});
  $('#courseList').querySelectorAll('a').forEach(a=>a.onclick=()=>toggleDrawer(false));
}
function markSeen(){const d=store.get(doneKey,{});d[L.slug+':steps']=Math.max(d[L.slug+':steps']||0,S+1);if(S===L.steps.length-1)d[L.slug]=true;store.set(doneKey,d);}
function go(i){S=Math.max(0,Math.min(L.steps.length-1,i));R=0;markSeen();render();startAnim();}
function openLesson(slug,step=0){const l=ALL.find(x=>x.slug===slug)||ALL[0];const changed=l!==L;L=l;if(changed)$('#metrics').dataset.lesson='';renderHead();go(step);window.scrollTo({top:0});}
function next(){const st=L.steps[S];if(st.solve&&R<st.solve.lines.length)return reveal(R+1);if(S<L.steps.length-1)return go(S+1);const nl=ALL[ALL.indexOf(L)+1];if(nl)openLesson(nl.slug,0);else{markSeen();renderDrawer();}}
function back(){if(S>0)return go(S-1);const pl=ALL[ALL.indexOf(L)-1];if(pl)openLesson(pl.slug,pl.steps.length-1);}
function route(){const m=location.hash.match(/^#([\w-]+?)-(\d+)$/);if(m)openLesson(m[1],+m[2]-1);else openLesson(ALL[0].slug,0);}
function toggleDrawer(o){$('#drawer').classList.toggle('open',o);$('#scrim').classList.toggle('open',o);}
$('#nextBtn').onclick=next;$('#backBtn').onclick=back;
$('#restartBtn').onclick=()=>go(0);
$('#pauseBtn').onclick=()=>{playing=!playing;$('#pauseBtn').textContent=playing?'❚❚':'▶';$('#pauseBtn').setAttribute('aria-label',playing?'Pause animation':'Play animation');if(playing)startAnim();};
$('#fsBtn').onclick=()=>{const s=$('#stage');try{document.fullscreenElement?document.exitFullscreen():s.requestFullscreen()}catch(e){}};
$('#menuBtn').onclick=()=>toggleDrawer(true);$('#closeDrawer').onclick=$('#scrim').onclick=()=>toggleDrawer(false);
$('#themeBtn').onclick=()=>{const d=document.documentElement.dataset.theme==='dark'?'':'dark';document.documentElement.dataset.theme=d;store.set(COURSE.storageKey+'-theme',d)};
document.documentElement.dataset.theme=store.get(COURSE.storageKey+'-theme','');
addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')back();if(e.key===' '){e.preventDefault();$('#pauseBtn').click()}if(e.key==='Escape')toggleDrawer(false)});
addEventListener('hashchange',()=>{const m=location.hash.match(/^#([\w-]+?)-(\d+)$/);if(m&&(m[1]!==L.slug||+m[2]-1!==S))route();});
route();
/* ENGINE:END */
</script>
</body>
</html>
