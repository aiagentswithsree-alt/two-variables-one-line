<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Two Variables, One Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* THEME:START */
:root{
  --bg:#f5eee2;--paper:#fbf7ef;--ink:#2a2620;--muted:#6f675b;--line:#2a2620;--soft:#e7dccb;
  --req:#e8833a;--res:#5e9e5a;--hs:#3c7fb8;--warn:#d64545;--accent:#cfe8b4;--accent-ink:#2f5b1f;
  --chip1:#f6dfa3;--chip2:#d6ecc4;--chip3:#e2d7f5;--node:#f3c969;--node2:#8fb3e0;--node3:#b9a6e6;--node4:#9ccf8f;
  --shadow:3px 3px 0 var(--line);--r:14px;
  --mono:'JetBrains Mono',ui-monospace,monospace;--sans:Inter,system-ui,sans-serif;
}
[data-theme=dark]{
  --bg:#1c1a17;--paper:#25221e;--ink:#efe7da;--muted:#a59c8e;--line:#efe7da;--soft:#3a352e;
  --accent:#3d5a2c;--accent-ink:#d6f0c0;--chip1:#5a4a20;--chip2:#2f4a26;--chip3:#3d3358;
}
/* THEME:END */
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
body{background-image:radial-gradient(var(--soft) 1px,transparent 1px);background-size:18px 18px}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:var(--mono)}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--bg);border-bottom:2px solid var(--line)}
.iconbtn{width:38px;height:38px;border:2px solid var(--line);border-radius:10px;background:var(--paper);display:grid;place-items:center;box-shadow:2px 2px 0 var(--line)}
.iconbtn:active{transform:translate(2px,2px);box-shadow:none}
.brand{font-family:var(--mono);font-weight:800;font-size:18px;flex:1}
.brand mark{background:var(--accent);color:inherit;padding:0 4px}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 110px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.wrap>*{min-width:0}
.card{background:var(--paper);border:2px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.crumb{font-family:var(--mono);font-size:13px;color:var(--muted)}
h1{font-family:var(--mono);font-weight:800;font-size:clamp(26px,4vw,40px);margin:6px 0 10px;letter-spacing:-.5px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:12px;padding:4px 10px;border:2px solid var(--line);border-radius:999px;background:var(--chip1)}
.chip:nth-child(2){background:var(--chip2)}.chip:nth-child(3){background:var(--chip3)}
.tagline{color:var(--muted);margin:10px 0 14px}
.stage{padding:12px;position:relative}
.metrics{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.metric{flex:1 0 110px;border:2px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--bg)}
.metric small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.6px;color:var(--muted);text-transform:uppercase}
.metric b{font-family:var(--mono);font-size:18px;white-space:nowrap}
.metric.total{background:var(--accent)}
.metric.flash b{color:var(--warn)}
svg.scene{width:100%;height:auto;display:block;margin-top:8px}
.legend{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.controls{margin-left:auto;display:flex;gap:6px}
.stage:fullscreen{background:var(--paper);overflow:auto}
.side{display:flex;flex-direction:column;gap:14px}
.steps{padding:12px 14px}
.steps .hdr{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.stepnav{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.stepnav button{min-width:30px;height:30px;border:2px solid var(--line);border-radius:8px;background:var(--bg);font-family:var(--mono);font-size:12px;padding:0 8px}
.stepnav button.done{background:var(--chip2)}
.stepnav button.on{background:var(--ink);color:var(--paper)}
.panel{padding:16px 18px}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.8px;color:var(--muted)}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;border:2px solid var(--line);margin:6px 0}
.tag.CONCEPT{background:var(--chip2)}.tag.PROBLEM{background:#f4c3c3;color:#2a2620}.tag.RECAP{background:var(--chip3)}.tag.TRY{background:var(--chip1)}
.panel h2{font-family:var(--mono);font-size:21px;margin:6px 0 10px}
.panel p{line-height:1.6;margin:0 0 10px}
.box{border:2px dashed var(--line);border-radius:10px;padding:10px 12px;margin:12px 0;background:var(--bg)}
.box .kicker{display:block;margin-bottom:4px}
.changes div{display:flex;gap:8px;font-size:14px;margin:4px 0}
.changes i{font-style:normal;font-family:var(--mono);font-weight:800;width:14px}
.points{padding-left:18px;line-height:1.6}
table.tbl{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:13px}
table.tbl td{padding:4px 0;border-bottom:1px dashed var(--soft)}table.tbl td:last-child{text-align:right}
table.tbl tr.sum td{font-weight:800;border-bottom:none;border-top:2px solid var(--line)}
.quiz button{display:block;width:100%;text-align:left;margin:6px 0;padding:8px 10px;border:2px solid var(--line);border-radius:8px;background:var(--paper)}
.quiz button.ok{background:var(--chip2)}.quiz button.bad{background:#f4c3c3;color:#2a2620}
.fb{font-size:14px;margin-top:6px}
.learn ul{padding-left:18px;line-height:1.7;margin:6px 0 0}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;gap:10px;padding:12px 16px;background:var(--bg);border-top:2px solid var(--line)}
.bottombar button{border:2px solid var(--line);border-radius:12px;padding:12px 16px;background:var(--paper);box-shadow:2px 2px 0 var(--line);font-weight:600}
.bottombar .next{flex:1;background:var(--accent);color:var(--accent-ink);text-align:left;display:flex;justify-content:space-between;font-family:var(--mono)}
.bottombar button:disabled{opacity:.4;cursor:default}
.drawer{position:fixed;inset:0 auto 0 0;width:min(360px,90vw);z-index:40;background:var(--paper);border-right:2px solid var(--line);transform:translateX(-102%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.open{transform:none}
.scrim{position:fixed;inset:0;background:#0006;z-index:30;display:none}.scrim.open{display:block}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:14px;border-bottom:2px solid var(--line);font-family:var(--mono);font-weight:800}
.drawer .list{overflow:auto;flex:1;padding:8px 10px}
.mod{margin:4px 0}.mod>button{width:100%;display:flex;gap:8px;align-items:center;border:0;background:none;padding:8px 4px;font-family:var(--mono);font-weight:600;text-align:left}
.mod .sw{width:14px;height:12px;border-radius:3px;border:1.5px solid var(--line)}
.mod .cnt{margin-left:auto;font-size:11px;color:var(--muted)}
.mod ul{list-style:none;margin:0 0 6px 22px;padding:0;border-left:2px dashed var(--soft)}
.mod li a{display:block;padding:6px 10px;color:var(--ink);text-decoration:none;font-size:14px;border-radius:8px;margin-left:6px}
.mod li a.cur{background:var(--accent);border:2px solid var(--line)}
.mod li a.done::after{content:" ✓";color:var(--res);font-weight:800}
.drawer .prog{padding:12px 14px;border-top:2px solid var(--line);font-family:var(--mono);font-size:13px;display:flex;justify-content:space-between}

.board{margin:8px 0 10px;display:flex;flex-direction:column;gap:10px}
.board .kicker{display:block;margin-bottom:4px}
.qbox{border:2px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--chip1);font-size:16px;line-height:1.55}
[data-theme=dark] .qbox{color:var(--ink)}
.simple{border-left:4px solid var(--res);padding:6px 12px;background:var(--bg);border-radius:0 8px 8px 0;line-height:1.5}
.gf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gf>div{border:2px dashed var(--line);border-radius:10px;padding:8px 12px;background:var(--bg);line-height:1.5}
.gf ul{margin:0;padding-left:18px}
@media(max-width:560px){.gf{grid-template-columns:1fr}}
.sol{margin-top:4px}
ol.lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ol.lines li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--paper);scroll-margin-bottom:110px;scroll-margin-top:80px}
ol.lines li.new{background:var(--accent);animation:pop .35s ease}
ol.lines .n{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:800;background:var(--bg)}
ol.lines .w{font-family:var(--mono);font-size:17px;font-weight:600;overflow-wrap:anywhere;white-space:pre-wrap}
ol.lines .why{font-size:14px;color:var(--muted);margin-top:3px}
ol.lines li.new .why{color:var(--accent-ink)}
.more{font-size:14px;color:var(--muted);border:2px dashed var(--soft);border-radius:10px;padding:10px 12px;text-align:center}
.check{border:2px dashed var(--res);border-radius:10px;padding:10px 12px;background:var(--bg);line-height:1.5}
.ans{border:2px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--chip2);font-size:16px;line-height:1.55;box-shadow:2px 2px 0 var(--line)}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.82em;line-height:1.15;margin:0 2px}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 2px}
.solvebtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.solvebtns button{border:2px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--paper);font-size:13px;font-family:var(--mono);box-shadow:2px 2px 0 var(--line)}
.tag.SOLVE{background:var(--chip1)}
.points.big{font-size:16px;line-height:1.7}
@keyframes pop{from{transform:translateY(6px);opacity:.2}to{transform:none;opacity:1}}

[hidden]{display:none!important}
.watch{font-family:var(--mono);font-size:12px;border:2px solid var(--line);border-radius:10px;padding:6px 9px;background:var(--chip2);color:#2a2620;white-space:nowrap;box-shadow:2px 2px 0 var(--line)}
.watch b{font-size:13px}.watch.paused{background:var(--bg);color:var(--muted)}
@media(max-width:720px){.watch .wsub{display:none}.brand{font-size:15px}}
.calhead{display:flex;align-items:center;gap:10px;margin:8px 0}.calhead b{font-family:var(--mono);font-size:15px}.calhead .muted{flex:1}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cw{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center}
.cd{position:relative;min-height:54px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:4px;display:flex;flex-direction:column;align-items:flex-start;cursor:pointer;font:inherit;text-align:left}
.cd.empty{border:none;background:none;cursor:default}.cd.future{opacity:.35;cursor:default}
.cd.l1{background:#e6f2d9;color:#2a2620}.cd.l2{background:#b8dca6;color:#2a2620}.cd.l3{background:#7dbb6f;color:#14260f}
.cd.now{outline:2px solid var(--req);outline-offset:1px}.cd.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.cd .dn{font-family:var(--mono);font-size:12px;font-weight:800}.cd .dm{font-family:var(--mono);font-size:11px;margin-top:auto}
.cd i{position:absolute;top:3px;right:4px;font-style:normal;font-size:11px;font-weight:800}.cd i.ok{color:#2f5b1f}.cd i.rs{font-size:9px;color:var(--muted)}
@media(max-width:480px){.cd{min-height:46px;padding:3px}.cd .dm{font-size:10px}.cd i.rs{display:none}}
.dayd{margin-top:12px;border-top:2px dashed var(--soft);padding-top:10px}.dayd h3{font-family:var(--mono);font-size:15px;margin:4px 0 8px}.dayd .kicker{display:block;margin-top:8px}
.glancebox{background:var(--paper);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
ol.glance{margin:6px 0 0;padding-left:22px}ol.glance li{padding:8px 0;border-bottom:1px dashed var(--soft)}ol.glance li:last-child{border-bottom:none}
.gq{font-weight:600;line-height:1.45}.ga{margin-top:4px;padding:4px 10px;border-left:4px solid var(--res);background:var(--chip2);color:#2a2620;line-height:1.5;font-size:14px}
.gw{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.45}
details.glancedet summary{cursor:pointer;font-family:var(--mono);font-size:13px;font-weight:600;margin:6px 0}
.helpbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}.helpbar.done .hbtn:not([data-h="explain"]):not([data-k="explain"]){display:none}
.exp{margin-top:10px;border:2px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg);line-height:1.6}
.exp h3{font-family:var(--mono);font-size:16px;margin:6px 0}.exp p{margin:6px 0}.exp .board{display:flex;flex-direction:column;gap:8px}
svg.mini{width:100%;max-width:520px;height:auto;display:block;margin:8px auto}
.primer h2{font-size:20px}.ptext{font-size:17px;line-height:1.65}.ptext .points{font-size:16px}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);background:var(--paper)}.dots i.on{background:var(--ink)}
.hbtn{border:2px dashed var(--line);border-radius:8px;padding:6px 10px;background:var(--bg);font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink);cursor:pointer}
.hint{font-size:14px;line-height:1.45;color:var(--ink);flex-basis:100%}.hint:empty{display:none}
.hint:not(:empty){border-left:4px solid #e2b44a;padding:6px 10px;background:var(--chip1);border-radius:0;color:#2a2620}
.opt.gone{opacity:.35;text-decoration:line-through}.opt.fixed{border-style:double}
.fillrow input.shown{background:var(--chip1);color:#2a2620}
.home{display:none;max-width:860px;margin:0 auto;padding:18px 16px 60px}
body.homeon .home{display:block}body.homeon .wrap,body.homeon .bottombar{display:none}
.todaybtn{width:auto;padding:0 10px;font-family:var(--mono);font-size:12px;font-weight:600;text-decoration:none;color:var(--ink)}
.bottombar{justify-content:space-between;padding:10px 16px}
.bottombar button{padding:9px 14px;font-size:14px;white-space:nowrap}
.bottombar .next{flex:0 1 360px;margin-left:auto}
.hhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.hhead h1{margin:4px 0 6px}.crumb a{color:var(--muted)}
.streak{border:2px solid var(--line);border-radius:12px;background:var(--chip1);padding:6px 14px;text-align:center;box-shadow:2px 2px 0 var(--line);color:#2a2620}
.streak b{display:block;font-family:var(--mono);font-size:26px;line-height:1.1}.streak span{font-size:11px;font-family:var(--mono)}
.tcard{padding:14px 16px;margin:12px 0}.tcard h2{font-family:var(--mono);font-size:19px;margin:6px 0}.tcard h3{font-family:var(--mono);font-size:15px;margin:6px 0}
.tcard p{line-height:1.6;margin:6px 0}.tcard.main{background:var(--accent);color:var(--accent-ink)}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}.twocol .tcard{margin:0}.twocol{margin:12px 0}
@media(max-width:640px){.twocol{grid-template-columns:1fr}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}.row.end{justify-content:flex-end}
.btn{display:inline-block;border:2px solid var(--line);border-radius:10px;padding:8px 14px;background:var(--paper);color:var(--ink);font-family:var(--mono);font-size:13px;font-weight:600;text-decoration:none;box-shadow:2px 2px 0 var(--line);cursor:pointer}
.btn.primary{background:var(--ink);color:var(--paper)}.btn.small{font-size:11px;padding:5px 9px}.btn:disabled{opacity:.45;cursor:default}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.muted{color:var(--muted)}.small{font-size:13px;margin:4px 0}
table.trk{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
table.trk th{text-align:left;font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400;padding:4px 6px}
table.trk td{padding:8px 6px;border-top:1px dashed var(--soft);vertical-align:top}table.trk small{display:block;color:var(--muted);font-size:12px}
.heatwrap{margin-top:12px}.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;max-width:420px;margin-top:6px}
.hc{display:inline-block;aspect-ratio:1;min-width:12px;border-radius:3px;border:1.5px solid var(--line);background:var(--bg)}
.hc.l1{background:#cfe8b4}.hc.l2{background:#9ccf8f}.hc.l3{background:#5e9e5a}.hc.rest{background:repeating-linear-gradient(45deg,var(--bg),var(--bg) 3px,var(--soft) 3px,var(--soft) 6px)}
.hc.now{outline:2px solid var(--req);outline-offset:1px}
.legend2{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-top:8px}.legend2 .hc{width:12px}
.mrow{display:grid;grid-template-columns:minmax(0,1.3fr) 2fr auto;gap:10px;align-items:center;margin-top:8px;font-size:14px}
.bar{height:12px;border:2px solid var(--line);border-radius:999px;overflow:hidden;background:var(--bg)}.bar i{display:block;height:100%;background:var(--res)}
.msub{font-size:11px;color:var(--muted);margin-left:2px}
ol.weak,ul.weak{padding-left:18px;margin:8px 0}ol.weak li,ul.weak li{margin:6px 0;line-height:1.5}ol.weak li span,ul.weak li span{margin-right:8px}
ol.weak a,ul.weak a,.lessonlink{font-family:var(--mono);font-size:12px;color:var(--hs)}
textarea{width:100%;font-family:var(--mono);font-size:12px;border:2px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);color:var(--ink);margin-top:8px}
.pbar{height:10px;border:2px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper);margin:8px 0 12px}.pbar i{display:block;height:100%;background:var(--res);transition:width .3s}
.qcard{padding:16px 18px}.qmeta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px}
.qtext{font-size:18px;line-height:1.5;margin:10px 0 12px}
.opts{display:flex;flex-direction:column;gap:8px}.opts.two{flex-direction:row}.opts.two .opt{flex:1;text-align:center}
.opt{text-align:left;border:2px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper);font-size:15px;line-height:1.4;color:var(--ink)}
.opt:disabled{cursor:default}.opt.pick{background:var(--chip1);color:#2a2620}.opt.ok{background:var(--chip2);color:#2a2620}.opt.bad{background:#f4c3c3;color:#2a2620}
.opt .ln,.kp .ln{display:inline-grid;place-items:center;width:22px;height:22px;border:1.5px solid var(--line);border-radius:50%;font-size:11px;margin-right:6px}
.reasons{margin-top:12px}
.fillrow{display:flex;gap:8px}.fillrow input{flex:1;min-width:0;font:inherit;font-family:var(--mono);font-size:17px;padding:9px 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.fillrow input.ok{background:var(--chip2);color:#2a2620}.fillrow input.bad{background:#f4c3c3;color:#2a2620}
.err{color:var(--warn);font-size:13px;min-height:1em}
.qfb{margin-top:12px}.fok,.fbad{border:2px solid var(--line);border-radius:10px;padding:10px 12px;line-height:1.55}.fok{background:var(--chip2);color:#2a2620}.fbad{background:#f8dede;color:#2a2620}
.fok a,.fbad a{color:#245a8a}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.match>div{display:flex;flex-direction:column;gap:8px}.match .opt{font-size:14px}
.opt.pair{border-width:3px}.p0{border-color:#3c7fb8!important}.p1{border-color:#e8833a!important}.p2{border-color:#8a5fc0!important}.p3{border-color:#c0407a!important}.p4{border-color:#2f8f6f!important}
ol.seq{margin:8px 0;padding-left:22px;min-height:30px}ol.seq li{padding:6px 8px;margin:4px 0;border:2px dashed var(--line);border-radius:8px;background:var(--bg)}

<script>
/* COURSE-DATA:START — the only part you rewrite for a new lesson/course */
const RL = {m:-6/5, d:28/5, label:'60x + 50y = 280', at:1.6, color:'var(--hs)'};       // Radha's bill line
const WL = {m:-1,   d:5,    label:'x + y = 5',        at:4.2, color:'var(--req)'};      // the 5 kg clue
const PLOT_LEGEND = [['var(--hs)','line'],['var(--res)','solution ✓'],['var(--warn)','not a solution'],['var(--req)','moving point']];
const AX = {xl:'x · kg of mangoes', yl:'y · kg of bananas'};

const COURSE = {
  brand: 'Two Variables, <mark>One Line</mark>',
  storageKey: 'gm9-ch13-two-variables',
  modules: [
    { name: 'One Equation', color: '#e2b44a', lessons: [
      {
        slug: 'one-bill-many-answers',
        primer: [
          {title:'Two unknowns, one fact', text:'Radha buys mangoes at ₹60 a kg and bananas at ₹50 a kg, and pays ₹280. We don’t know how many kg of each, so we call them <b>x</b> and <b>y</b>.'},
          {title:'One fact becomes an equation', text:'Cost of mangoes + cost of bananas = bill, so <b>60x + 50y = 280</b>. Two letters, each with power 1: a <b>linear equation in two variables</b>. Its tidy form is <b>ax + by + c = 0</b>.'},
          {title:'Many answers, one line', text:'Many pairs make the bill ₹280, like (3, 2) and (0.5, 5). Plot them all and they sit on <b>one straight line</b>.', plotFrom:7}
        ],
        worked: ['ex-13-2', 1],
        title: 'One Bill, Many Answers',
        minutes: 10, level: 'Grade 9',
        tagline: 'Radha paid ₹280 for mangoes and bananas. Follow that one bill until it turns into a straight line.',
        learn: ['Turn a shopping situation into a linear equation in two variables','Write any such equation in standard form ax + by + c = 0','Check whether an ordered pair is a solution','Why one equation has infinitely many solutions','Why every solution sits on one straight line'],
        nextTeaser: 'How Steep Is a Line? — measuring the tilt of Radha’s line with rise and run.',
        unitPrefix: '₹', unit: '',
        legend: PLOT_LEGEND,
        metrics: [ {id:'mango',label:'Mangoes 60x'},{id:'banana',label:'Bananas 50y'} ],
        totalLabel: 'Bill (target ₹280)',
        nodes: [], edges: [],
        steps: [
          { nav:'The bill', tag:'CONCEPT', title:'Radha pays ₹280',
            body:['At a fruit cart, mangoes cost <b>₹60 a kg</b> and bananas <b>₹50 a kg</b>. Radha buys some of each and pays <b>₹280</b>.','She has forgotten how many kilograms of each she bought. Can we work it out?'],
            key:'Two unknown amounts, one known fact. The whole chapter grows from this setting.',
            plot:{xr:[-1,7],yr:[-2.5,7],...AX}, metrics:{} },
          { nav:'Write it', tag:'CONCEPT', title:'Name the unknowns, write the equation',
            body:['Let <b>x</b> = kg of mangoes and <b>y</b> = kg of bananas. Mangoes cost 60x rupees and bananas cost 50y rupees.','Both sides below measure the same money, so <b>60x + 50y = 280</b>.'],
            changes:[['+','x = kilograms of mangoes'],['+','y = kilograms of bananas'],['+','equation 60x + 50y = 280']],
            key:'An equation with two variables, each raised only to the power 1, is a <b>linear equation in two variables</b>.',
            plot:{xr:[-1,7],yr:[-2.5,7],...AX}, metrics:{} },
          { nav:'Standard form', tag:'CONCEPT', title:'Put it in standard form',
            body:['Any such equation can be written as <b>ax + by + c = 0</b>, where a and b are not both zero.','Move 280 across: <b>60x + 50y − 280 = 0</b>. Dividing every term by 10 gives the same equation with smaller numbers: 6x + 5y − 28 = 0.'],
            table:{title:'Reading off a, b, c',rows:[['a (coefficient of x)','60'],['b (coefficient of y)','50'],['c (constant)','−280']],foot:'Fractions or decimals are allowed too; we usually clear them by multiplying.'},
            quiz:{q:'Which is 2y = 7 written in standard form?',options:['0·x + 2y − 7 = 0','2x + y − 7 = 0','It is not a linear equation in two variables'],answer:0,why:'The coefficient of x is simply 0. Equations like this still count as linear equations in two variables.'},
            plot:{xr:[-1,7],yr:[-2.5,7],...AX}, metrics:{} },
          { nav:'First guess', tag:'CONCEPT', title:'Try x = 3, y = 2',
            body:['Substitute: 60 × 3 + 50 × 2 = 180 + 100 = 280. The bill matches.','So x = 3, y = 2 is a <b>solution</b>. We write it as the ordered pair <b>(3, 2)</b>: x first, then y.'],
            key:'A solution is a pair of values that makes the left side equal the right side.',
            plot:{xr:[-1,7],yr:[-2.5,7],...AX, points:[{x:3,y:2,label:'(3, 2) ✓',ok:true}], movers:[{from:[0,0],to:[3,2]}]},
            metrics:{mango:180,banana:100} },
          { nav:'Swap order', tag:'PROBLEM', title:'Case: the pair written backwards',
            body:['What about (2, 3)? That means 2 kg mangoes and 3 kg bananas: 120 + 150 = 270. The bill is ₹10 short.','Same two numbers, different order, different answer.'],
            changes:[['~','x: 3 → 2 kg'],['~','y: 2 → 3 kg'],['~','bill: ₹280 → ₹270 ✗']],
            key:'Order matters. In (a, b) the first number is always x and the second is always y.',
            plot:{xr:[-1,7],yr:[-2.5,7],...AX, points:[{x:3,y:2,label:'(3, 2) ✓',ok:true,dx:34,dy:14},{x:2,y:3,label:'(2, 3) ✗',bad:true}], movers:[{from:[0,0],to:[2,3]}]},
            metrics:{mango:120,banana:150}, flash:['_total'] },
          { nav:'More answers', tag:'CONCEPT', title:'Pick any x, and y follows',
            body:['Choose a value for x, put it in, and solve the one-variable equation that is left for y.','x = 0.5 gives 30 + 50y = 280, so y = 5. Since x can be any number, the solutions never run out.'],
            table:{title:'Solutions found so far',rows:[['x = 0','y = 5.6'],['x = 0.5','y = 5'],['x = 1','y = 4.4'],['x = 3','y = 2']],foot:'Each row puts the bill at exactly ₹280.'},
            plot:{xr:[-1,7],yr:[-2.5,7],...AX, points:[{x:0,y:5.6,label:'(0, 5.6)',ok:true,dx:44,dy:4},{x:0.5,y:5,label:'(0.5, 5)',ok:true,dx:50,dy:6},{x:1,y:4.4,label:'(1, 4.4)',ok:true,dx:50,dy:6},{x:3,y:2,label:'(3, 2)',ok:true,dx:40,dy:6}], movers:[{from:[0.5,0],to:[0.5,5]}]},
            metrics:{mango:30,banana:250} },
          { nav:'The line', tag:'CONCEPT', title:'All the solutions form a line',
            body:['Rearranged, the equation reads <b>y = −(6/5)x + 28/5</b>. Plotting every solution gives one straight line.','Each point on the line is a solution, and each solution is a point on the line.'],
            key:'The graph of a linear equation in two variables is always a straight line.',
            quiz:{q:'Is (4, 0.8) on Radha’s line?',options:['Yes: 240 + 40 = 280','No: x must be a whole number','No: the point is too close to the x-axis'],answer:0,why:'60 × 4 + 50 × 0.8 = 240 + 40 = 280, so the pair satisfies the equation and lies on the line.'},
            plot:{xr:[-1,7],yr:[-2.5,7],...AX, lines:[RL], points:[{x:0,y:5.6,ok:true},{x:0.5,y:5,ok:true},{x:1,y:4.4,ok:true},{x:3,y:2,label:'(3, 2)',ok:true,dx:40,dy:6}], movers:[{from:[0,5.6],to:[14/3,0]}]},
            metrics:{mango:180,banana:100} },
          { nav:'Real limits', tag:'PROBLEM', title:'Case: a solution no shop can sell',
            body:['Follow the line further. At x = 6, y = −1.6: 360 − 80 = 280. The equation is satisfied.','But nobody can buy −1.6 kg of bananas. Only the part of the line where x ≥ 0 and y ≥ 0 makes sense for Radha.'],
            changes:[['+','point (6, −1.6) satisfies the equation'],['-','negative kilograms are impossible in real life']],
            key:'Algebra gives every solution. The situation decides which ones are sensible.',
            plot:{xr:[-1,7],yr:[-2.5,7],...AX, lines:[RL], points:[{x:3,y:2,label:'(3, 2)',ok:true,dx:40,dy:6},{x:6,y:-1.6,label:'(6, −1.6) ?',bad:true,dx:-50,dy:4}], movers:[{from:[3,2],to:[6,-1.6]}]},
            metrics:{mango:360,banana:-80}, flash:['banana'] },
          { nav:'Recap', tag:'RECAP', title:'One bill, a whole line of answers',
            body:['One equation narrowed Radha’s purchase down to a line, not to one answer. To pin it down we need a second fact.'],
            points:['Linear equation in two variables: ax + by + c = 0, with a and b not both zero.','A solution is an ordered pair; the order is (x, y).','There are infinitely many solutions, and together they make a straight line.','The real situation can rule out some solutions, such as negative amounts.'],
            table:{title:'The (3, 2) bill',rows:[['3 kg mangoes × ₹60','₹180'],['2 kg bananas × ₹50','₹100']],sum:['total','₹280'],foot:'Correct, but (0.5, 5) and (1, 4.4) also give ₹280.'},
            plot:{xr:[-1,7],yr:[-2.5,7],...AX, lines:[RL], points:[{x:3,y:2,label:'(3, 2)',ok:true,dx:40,dy:6}]},
            metrics:{mango:180,banana:100} }
        ]
      },
      {
        slug: 'how-steep-is-a-line',
        primer: [
          {title:'Slope = steepness', text:'Slope is one number that tells you how steep a line is: how much it climbs or falls as you move to the right.', plotFrom:1},
          {title:'Rise ÷ run', text:'Move right (the <b>run</b>) and up (the <b>rise</b>). <b>Slope = rise ÷ run</b>. From (2, 0) to (4, 3): rise 3, run 2, slope 3/2.', plotFrom:2},
          {title:'Up, down, flat, straight up', text:'Rising lines have a <b>positive</b> slope and falling lines a <b>negative</b> one. Flat lines have slope <b>0</b>; vertical lines have an <b>undefined</b> slope.', plotFrom:9}
        ],
        worked: ['ex-13-3', 2],
        title: 'How Steep Is a Line?',
        minutes: 12, level: 'Grade 9',
        tagline: 'Ride a cyclist up and down straight-line roads and measure steepness with one number.',
        learn: ['What rise, run and slope mean','Why the slope is the same between any two points on a line','Positive, negative, zero and undefined slopes','Reading the slope m and intercept d from y = mx + d','Getting the slope from standard form: m = −a/b'],
        nextTeaser: 'Where Two Lines Meet — add a second clue to Radha’s bill and find the single answer.',
        unit: '', total: false,
        legend: [['var(--req)','run (across)'],['var(--res)','rise (up/down)'],['var(--hs)','line']],
        metrics: [ {id:'rise',label:'Rise'},{id:'run',label:'Run'},{id:'slope',label:'Slope = rise ÷ run'} ],
        nodes: [], edges: [],
        steps: [
          { nav:'The hill', tag:'CONCEPT', title:'Steeper road, harder ride',
            body:['On a flat road you pedal easily. As the road tilts upward you work harder, and the steeper it gets, the harder it is.','In maths, the steepness of a line is called its <b>slope</b> (or gradient).'],
            key:'Slope is one number that tells you how much a line climbs or falls.',
            plot:{xr:[-1,9],yr:[-1,10],equal:true, lines:[{m:1.5,d:-3,label:'road',at:6.6}], movers:[{from:[2,0],to:[8,9]}]}, metrics:{} },
          { nav:'Rise & run', tag:'CONCEPT', title:'Measure rise and run',
            body:['Go from A(2, 0) to B(4, 3). You move 2 units right (the <b>run</b>) and 3 units up (the <b>rise</b>).','Slope = rise ÷ run = (y₂ − y₁) ÷ (x₂ − x₁) = 3 ÷ 2.'],
            key:'Right is a positive run, up is a positive rise.',
            plot:{xr:[-1,9],yr:[-1,10],equal:true, lines:[{m:1.5,d:-3}], tri:{a:[2,0],b:[4,3]}, points:[{x:2,y:0,label:'A(2, 0)',dx:-40,dy:-4},{x:4,y:3,label:'B(4, 3)',dx:-44,dy:-4}]},
            metrics:{rise:3,run:2,slope:'3/2'} },
          { nav:'Any two points', tag:'CONCEPT', title:'Same slope wherever you measure',
            body:['Now measure from B(4, 3) to D(8, 9): run 4, rise 6. Slope = 6 ÷ 4 = 3/2, the same as before.','A straight line has one slope. The triangle grows, but its shape stays the same.'],
            changes:[['~','run: 2 → 4'],['~','rise: 3 → 6'],['~','slope: unchanged at 3/2']],
            quiz:{q:'On this line, what is y when x = 6?',options:['6','4.5','9'],answer:0,why:'From B(4, 3), a run of 2 gives a rise of 3 (slope 3/2), so the point is (6, 6).'},
            plot:{xr:[-1,9],yr:[-1,10],equal:true, lines:[{m:1.5,d:-3}], tri:{a:[4,3],b:[8,9]}, points:[{x:2,y:0,label:'A',dx:-18,dy:-4},{x:4,y:3,label:'B(4, 3)',dx:-44,dy:-4},{x:8,y:9,label:'D(8, 9)',dx:-46,dy:-2}]},
            metrics:{rise:6,run:4,slope:'3/2'} },
          { nav:'Downhill', tag:'CONCEPT', title:'A road that falls',
            body:['From P(−4, 5) to Q(−1, 2): run +3, rise −3. Slope = −3 ÷ 3 = −1.','Go the other way, Q to P: rise +3, run −3. The slope is still −1, so the order of the points does not matter.'],
            key:'Negative slope: the line goes down as you move left to right.',
            plot:{xr:[-6,4],yr:[-2,7],equal:true, lines:[{m:-1,d:1,label:'y = −x + 1',at:1.8}], tri:{a:[-4,5],b:[-1,2]}, points:[{x:-4,y:5,label:'P(−4, 5)',dx:-52,dy:4},{x:-1,y:2,label:'Q(−1, 2)',dx:42,dy:-4}], movers:[{from:[-4,5],to:[2,-1]}]},
            metrics:{rise:-3,run:3,slope:'−1'} },
          { nav:'Read m', tag:'CONCEPT', title:'Slope hides in y = mx + d',
            body:['Take two points on y = mx + d. Their rise is (mx₂ + d) − (mx₁ + d) = m(x₂ − x₁), and dividing by the run leaves just <b>m</b>.','So in <b>y = −2x + 4</b> the slope is −2, and d = 4 is where the line crosses the y-axis, at (0, 4).'],
            key:'In y = mx + d: m is the slope and d is the y-intercept. You can read both straight off.',
            plot:{xr:[-2,5],yr:[-2,6],equal:true, lines:[{m:-2,d:4,label:'y = −2x + 4',at:2.6}], tri:{a:[0,4],b:[1,2]}, points:[{x:0,y:4,label:'(0, 4)',dx:-34,dy:-4},{x:1,y:2,label:'(1, 2)',dx:34,dy:-4},{x:2,y:0,label:'(2, 0)',dx:30,dy:-12}]},
            metrics:{rise:-2,run:1,slope:'−2'} },
          { nav:'Flat & vertical', tag:'PROBLEM', title:'Case: lines with no tilt, or all tilt',
            body:['<b>y = 3</b> is flat: the rise is always 0, so the slope is 0.','<b>x = 2</b> stands straight up: the run is 0, and rise ÷ 0 cannot be computed. Its slope is <b>undefined</b>.'],
            changes:[['+','horizontal line y = 3 → slope 0'],['+','vertical line x = 2 → run 0'],['-','x = 2 cannot be written as y = mx + d']],
            key:'Horizontal: slope 0. Vertical: slope undefined, because we cannot divide by zero.',
            plot:{xr:[-2,6],yr:[-1,6],equal:true, lines:[{m:0,d:3,label:'y = 3',at:4.6,color:'var(--node4)'},{x:2,label:'x = 2',at:5,color:'var(--warn)'}], tri:{a:[2,0.5],b:[2,4.5]}},
            metrics:{rise:4,run:0,slope:'undefined'}, flash:['slope','run'] },
          { nav:'From standard', tag:'TRY', title:'Slope of Radha’s line',
            body:['From ax + by + c = 0 we get y = −(a/b)x − c/b, so <b>m = −a/b</b> (when b ≠ 0).','Radha’s 6x + 5y − 28 = 0 has slope −6/5: each extra kilogram of mangoes means 1.2 kg fewer bananas.'],
            quiz:{q:'What is the slope of 2x + 4y − 12 = 0?',options:['−1/2','2','−2'],answer:0,why:'m = −a/b = −2/4 = −1/2. The line falls by 1 for every 2 steps to the right.'},
            plot:{xr:[-1,7],yr:[-1,7],equal:true, lines:[{...RL,label:'6x + 5y − 28 = 0',at:3.6}], tri:{a:[0,5.6],b:[1,4.4]}, points:[{x:0,y:5.6},{x:1,y:4.4}]},
            metrics:{rise:-1.2,run:1,slope:'−6/5'} },
          { nav:'Ramp', tag:'TRY', title:'Build a ramp to a rule',
            body:['A goods ramp must have slope <b>1/12</b> and climb <b>0.5 m</b> to the loading floor.','Run = rise ÷ slope = 0.5 × 12 = <b>6 m</b> of floor space.'],
            quiz:{q:'If the floor were 0.75 m high, how long a run would the same rule need?',options:['9 m','6.75 m','12 m'],answer:0,why:'Run = 0.75 × 12 = 9 m. A gentler slope always costs more length.'},
            plot:{xr:[-0.5,7],yr:[-0.5,1.5], lines:[{m:1/12,d:0,label:'slope 1/12',at:2.6}], tri:{a:[0,0],b:[6,0.5]}, movers:[{from:[0,0],to:[6,0.5]}]},
            metrics:{rise:'0.5 m',run:'6 m',slope:'1/12'} },
          { nav:'Recap', tag:'RECAP', title:'Slope, summed up',
            body:['Slope is rise ÷ run between any two points, and it does not change along a straight line.'],
            points:['Rise and run can be negative, and the point order does not change the slope.','In y = mx + d, m is the slope and d the y-intercept.','From standard form, m = −a/b.','Two lines with the same slope never meet. That matters in the next lesson.'],
            table:{title:'Slope cheat-sheet',rows:[['rises left → right','m > 0'],['falls left → right','m < 0'],['horizontal, y = k','m = 0'],['vertical, x = k','undefined']],foot:'slope = (y₂ − y₁) ÷ (x₂ − x₁)'},
            plot:{xr:[-4,6],yr:[-2,6],equal:true, lines:[{m:1.5,d:-1,label:'m > 0',at:3.3,color:'var(--res)'},{m:-1,d:3,label:'m < 0',at:-2.4,color:'var(--req)'},{m:0,d:5,label:'m = 0',at:4.4,color:'var(--node4)'},{x:5,label:'undefined',at:1,color:'var(--warn)'}]},
            metrics:{rise:3,run:2,slope:'3/2'} }
        ]
      }
    ]},
    { name: 'Two Equations', color: '#8fb3e0', lessons: [
      {
        slug: 'where-two-lines-meet',
        primer: [

  solve:{q:'A fraction becomes 9/11 if 2 is added to both numerator and denominator. If 3 is added to both, it becomes 5/6. Find the fraction.',
   simple:'Fraction = x/y. Add 2 to top and bottom → 9/11. Add 3 → 5/6.',
   given:[`${fr('x + 2','y + 2')} = ${fr(9,11)}`,`${fr('x + 3','y + 3')} = ${fr(5,6)}`], find:'x/y',
   lines:[
    ['11(x + 2) = 9(y + 2)  →  11x + 22 = 9y + 18','Cross-multiply the first.'],
    ['11x − 9y = −4  …(1)','Move terms: 18 − 22 = −4.'],
    ['6(x + 3) = 5(y + 3)  →  6x + 18 = 5y + 15','Cross-multiply the second.'],
    ['6x − 5y = −3  …(2)','15 − 18 = −3.'],
    ['(1) × 5: 55x − 45y = −20;   (2) × 9: 54x − 45y = −27','Make the y-terms equal.'],
    ['Subtract:  x = −20 − (−27) = 7','−45y cancels.'],
    ['In (1):  77 − 9y = −4  →  9y = 81  →  y = 9','Substitute x = 7.']],
   check:'(7+2)/(9+2) = 9/11 ✓   (7+3)/(9+3) = 10/12 = 5/6 ✓',
   answer:'The fraction is <b>7/9</b>.'}},

const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const nz=(a,b)=>{let v;do{v=rnd(a,b)}while(v===0);return v;};
const ng=v=>v<0?'−'+(-v):String(v);
const cf=(v,x)=>(v===1?'':v===-1?'−':ng(v))+x;
const lin=(a,b)=>`${cf(a,'x')} ${b<0?'−':'+'} ${Math.abs(b)===1?'':Math.abs(b)}y`;
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;};
const fracS=(n,d)=>{if(d<0){n=-n;d=-d;}const g=gcd(n,d);n/=g;d/=g;return d===1?ng(n):`${ng(n)}/${d}`;};

const GEN = {
  findY(){const a=nz(-5,5),b=nz(-5,5),x=rnd(-3,4),y=rnd(-4,5),c=a*x+b*y;
    return {hint:`Put x = ${ng(x)} in, move that number to the right side, then divide by the number with y.`,type:'fill',q:`In ${lin(a,b)} = ${ng(c)}, put x = ${ng(x)}. Find y.`,a:[String(y)],
      why:`${ng(a)} × ${ng(x)} = ${ng(a*x)}, so ${ng(b)}y = ${ng(c)} − (${ng(a*x)}) = ${ng(b*y)}, and y = ${ng(y)}.`};},
  isSol(){const a=nz(-5,5),b=nz(-5,5),x=rnd(-3,4),y=rnd(-3,4),ok=Math.random()<.5,c=a*x+b*y+(ok?0:nz(-3,3));
    return {hint:'Put the x and y values in, work out the left side, and compare it with the right side.',type:'mcq',q:`Is (${ng(x)}, ${ng(y)}) a solution of ${lin(a,b)} = ${ng(c)}?`,opts:['Yes','No'],a:ok?0:1,
      why:`LHS = ${ng(a)}(${ng(x)}) + ${ng(b)}(${ng(y)}) = ${ng(a*x+b*y)}; RHS = ${ng(c)}. ${ok?'Equal, so yes.':'Not equal, so no.'}`};},
  findK(){const k=nz(-4,5),b=nz(-4,4),x=nz(-3,4),y=rnd(-3,3),c=k*x+b*y;
    return {hint:'Put the given x and y into the equation. Only k is left, so solve for it.',type:'fill',q:`(${ng(x)}, ${ng(y)}) is a solution of kx ${b<0?'−':'+'} ${Math.abs(b)===1?'':Math.abs(b)}y = ${ng(c)}. Find k.`,a:[String(k)],
      why:`k(${ng(x)}) + ${ng(b)}(${ng(y)}) = ${ng(c)} → ${ng(x)}k = ${ng(c-b*y)} → k = ${ng(k)}.`};},
  slope2(){const x1=rnd(-4,3),y1=rnd(-4,3),run=nz(-4,4),rise=nz(-5,5);
    return {hint:'slope = (y₂ − y₁) ÷ (x₂ − x₁). Keep the points in the same order on top and bottom.',type:'fill',q:`Slope of the line through (${ng(x1)}, ${ng(y1)}) and (${ng(x1+run)}, ${ng(y1+rise)})? A fraction is fine.`,a:[fracS(rise,run).replace('−','-')],
      why:`rise = ${ng(y1+rise)} − (${ng(y1)}) = ${ng(rise)}, run = ${ng(x1+run)} − (${ng(x1)}) = ${ng(run)}, slope = ${fracS(rise,run)}.`};},
  slopeStd(){const a=nz(-6,6),b=nz(-6,6),c=rnd(-9,9);
    return {hint:'m = −a ÷ b, where a is the number with x and b is the number with y.',type:'fill',q:`Slope of ${lin(a,b)} ${c<0?'−':'+'} ${Math.abs(c)} = 0? A fraction is fine.`,a:[fracS(-a,b).replace('−','-')],
      why:`m = −a/b = −(${ng(a)})/(${ng(b)}) = ${fracS(-a,b)}.`};},
  sumDiff(){const x=rnd(-6,20),y=rnd(-6,20);
    return {hint:'Add the two equations: y cancels. Then divide by 2.',type:'fill',q:`x + y = ${ng(x+y)} and x − y = ${ng(x-y)}. Find x.`,a:[String(x)],
      why:`Add the equations: 2x = ${ng(x+y)} + (${ng(x-y)}) = ${ng(2*x)}, so x = ${ng(x)} (and y = ${ng(y)}).`};},
  subst(){let k,a,b;do{k=nz(-3,3);a=nz(-4,5);b=nz(-4,5);}while(a+b*k===0);const m=rnd(-4,6),x=rnd(-3,5),y=k*x+m,c=a*x+b*y;
    const yx=`${cf(k,'x')}${m?` ${m<0?'−':'+'} ${Math.abs(m)}`:''}`;
    return {hint:'Replace y in the second equation with the expression for y, then solve for x.',type:'fill',q:`y = ${yx} and ${lin(a,b)} = ${ng(c)}. Find x.`,a:[String(x)],
      why:`Substitute: ${ng(a)}x + ${ng(b)}(${yx}) = ${ng(c)} → ${ng(a+b*k)}x = ${ng(c-b*m)} → x = ${ng(x)}.`};},
  ratio(){const kind=rnd(0,2),a1=nz(1,5),b1=nz(-5,5),c1=nz(-9,9),k=rnd(2,3);let a2,b2,c2;
    if(kind===0){do{a2=nz(-5,5);b2=nz(-5,5);}while(a1*b2===a2*b1);c2=nz(-9,9);}
    else if(kind===1){a2=k*a1;b2=k*b1;c2=k*c1+nz(1,3);} else {a2=k*a1;b2=k*b1;c2=k*c1;}
    return {hint:'Work out a₁/a₂ and b₁/b₂ first. Only if they are equal, compare c₁/c₂.',type:'mcq',q:`${lin(a1,b1)} = ${ng(c1)} and ${lin(a2,b2)} = ${ng(c2)} have…`,opts:['one solution (lines cross)','no solution (parallel)','infinitely many (same line)'],a:kind,
      why:`a₁/a₂ = ${fracS(a1,a2)}, b₁/b₂ = ${fracS(b1,b2)}, c₁/c₂ = ${fracS(c1,c2)}. ${['The x and y ratios differ.','x and y ratios equal, constants differ.','All three ratios are equal.'][kind]}`};}
};

const NS='http://www.w3.org/2000/svg';
function el(tag,attrs={},parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent&&parent.appendChild(e);return e;}
function tile(g,x,y,w=58){el('polygon',{points:`${x},${y-w*.5} ${x+w},${y} ${x},${y+w*.5} ${x-w},${y}`,fill:'var(--paper)',stroke:'var(--line)','stroke-width':2},g);
  el('polygon',{points:`${x-w},${y} ${x},${y+w*.5} ${x},${y+w*.5+8} ${x-w},${y+8}`,fill:'var(--soft)',stroke:'var(--line)','stroke-width':2},g);
  el('polygon',{points:`${x+w},${y} ${x},${y+w*.5} ${x},${y+w*.5+8} ${x+w},${y+8}`,fill:'var(--bg)',stroke:'var(--line)','stroke-width':2},g);}
function pill(g,x,y,text,warn){const t=el('text',{x,y,'text-anchor':'middle','font-family':'JetBrains Mono, monospace','font-size':11,fill:warn?'#fff':'var(--ink)'});t.textContent=text;g.appendChild(t);
  const w=Math.max(40,text.length*6.9+16);const r=el('rect',{x:x-w/2,y:y-13,width:w,height:19,rx:9.5,fill:warn?'var(--warn)':'var(--paper)',stroke:'var(--line)','stroke-width':1.5});g.insertBefore(r,t);}
function drawNode(g,n,step){
  const warn=(step.warn||[]).includes(n.id);const x=n.x,y=n.y;
  tile(g,x,y);
  const fill=warn?'#f4c3c3':(n.color||'var(--node)');
  if(n.kind==='laptop'){

const norm=s=>String(s).toLowerCase().replace(/[−–]/g,'-').replace(/×/g,'*').replace(/\s+/g,'').replace(/\.$/,'');
const numv=s=>{s=norm(s);let m=s.match(/^(-?\d+(?:\.\d+)?)$/);if(m)return +m[1];m=s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);if(m&&+m[2]!==0)return m[1]/m[2];return null;};

function autoHint(c,level){
  const a=String((c.a||[])[0]||'');
  if(level>=1){const ch=a.replace(/^-/,'');return `${a.startsWith('-')?'It is negative, and it ':'It '}starts with “${ch[0]}”${/^[a-z]/i.test(ch)?` and has ${ch.replace(/\s/g,'').length} letters`:''}.`;}
  if(c.hint)return c.hint;
  if(/^-?\d+(\.\d+)?$/.test(a))return `The answer is a ${a.includes('.')?'decimal':'whole'} number${a.startsWith('-')?' (negative)':''}.`;
  if(/^-?\d+\/\d+$/.test(a))return `The answer is a fraction${a.startsWith('-')?' (negative)':''}.`;
  return `It is a word with ${a.replace(/\s/g,'').length} letters.`;}

    document.getElementById('aAgain').onclick=()=>startPractice(true);}});
  if(auto)document.getElementById('aStart').click();
}
